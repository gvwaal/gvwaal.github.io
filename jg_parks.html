<!DOCTYPE html>
<html lang="en">
<head>
	<base target="_top">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

	<!-- Leaflet dependencies-->
    <link rel="stylesheet" href="plugins/leaflet/leaflet.css"/>
    <script src="plugins/leaflet/leaflet.js"></script>

	<style>
		html, body {
			height: 100%;
			margin: 0;
		}
		.leaflet-container {
			height: 100%;
			width: 100%;
			max-width: 100%;
			max-height: 100%;
		}
	</style>
	
</head>
	<body>
		<div id='map'></div>
		<script type="text/javascript" src="plugins/leaflet/parks_20min.js"></script>
		<script type="text/javascript" src="plugins/leaflet/boundary_20min.js"></script>
		<script type="text/javascript" src="plugins/leaflet/parks_where_we_walked.js"></script>

		<script type="text/javascript">
			const map = L.map('map').setView([44.946488868731905, -93.21985018893679], 11);

			map.locate({setView: true, maxZoom: 18});

			const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
				maxZoom: 19,
				attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
			}).addTo(map);

			function zoomToFeature(e) {
    			map.fitBounds(e.target.getBounds());
			};

			// Adds layers to map
			const isochrone = L.geoJson(boundary, {
				style: style_isochrone
			}).addTo(map);

			const parks = L.geoJson(parks_20min, {
				style: style_parks,
				onEachFeature: onEachFeature_parks
			}).addTo(map);
			
			const paths = L.geoJson(where_we_walked, {
				style: style_paths,
				onEachFeature: onEachFeature_paths
			}).addTo(map);

			// Adds behavior relating to layers (popups and zooming to feature on click)
			function onEachFeature_parks(feature, layer) {
				layer.on({
					click: zoomToFeature
				});
				let popupContent = `<p>${feature.properties.park_name}</p>`;

				if (feature.properties && feature.properties.popupContent) {
					popupContent += feature.properties.popupContent;
				}
				layer.bindPopup(popupContent);
			}

			function onEachFeature_paths(feature, layer) {
				let popupContent = `<p><b>Date/time visited: </b>${feature.properties.date_visited}</p>
									<p><b>Jessi's thoughts: </b>${feature.properties.j_comments}</p>
									<p><b>Gerrit's thoughts: </b>${feature.properties.g_comments}</p>
									<p><b>Weather when we visited: </b>${feature.properties.temp}°F, ${feature.properties.windyness}, and ${feature.properties.cloudyness}</p>`;

				if (feature.properties && feature.properties.popupContent) {
					popupContent += feature.properties.popupContent;
				}
				layer.bindPopup(popupContent);
			}

			// Adds styling for the layers
			function style_isochrone(feature) {
				return {
					color: 'red',
					weight: 3,
					fillOpacity: 0,
				}
			}

			function style_parks(feature) {
				return {
					color: '#3388ff',
					weight: 3,
					fillOpacity: 0.1,
				}
			}

			function style_paths(feature) {
				return {
					color: 'green',
					weight: 3,
					fillOpacity: 0,
				}
			}

			// Adds functionality relating to fetching device location (adds a circle at the location) 
			function onLocationFound(e) {
				L.circle(e.latlng, {
					color: 'red',
					fillColor: '#f03',
					fillOpacity: 0.5,
					radius: 5
				}).addTo(map);
			}
			map.on('locationfound', onLocationFound);

			function onLocationError(e) {
				alert(e.message);
			}
			map.on('locationerror', onLocationError);
		</script>
	</body>
</html>
